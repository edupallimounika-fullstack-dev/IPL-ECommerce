<header class="app-header">

  <div class="header-container">

    <a
      routerLink="/products"
      class="logo">

      🏏 IPL STORE

    </a>


    <nav class="main-nav">

      <a
        routerLink="/products"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">

        Products

      </a>


      <a
        routerLink="/cart"
        routerLinkActive="active">

        🛒 Cart

      </a>


      <a
        routerLink="/orders"
        routerLinkActive="active">

        My Orders

      </a>

    </nav>


    <div class="auth-nav">

      @if (authService.isAuthenticated()) {

        <button
          type="button"
          class="logout-button"
          (click)="logout()">

          Logout

        </button>

      } @else {

        <a
          routerLink="/login"
          class="login-button">

          Login

        </a>

      }

    </div>

  </div>

</header>


<main class="page-container">

  <router-outlet></router-outlet>

</main>
